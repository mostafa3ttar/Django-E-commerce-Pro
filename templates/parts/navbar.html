<!-- header section starts -->

<header class="main-header">
  <section class="ftco-section pt-0 pb-0">
    <div class="container-fluid px-md-5 py-3">
      <div class="row align-items-center justify-content-between">
        <div class="col-md-4 d-flex">
          <div class="social-media">
            <p class="mb-0 d-flex">
              <a href="#" class="d-flex align-items-center justify-content-center"><span
                  class="fa fa-facebook"></span></a>
              <a href="#" class="d-flex align-items-center justify-content-center"><span
                  class="fa fa-twitter"></span></a>
              <a href="#" class="d-flex align-items-center justify-content-center"><span
                  class="fa fa-instagram"></span></a>
              <!-- <a href="#" class="d-flex align-items-center justify-content-center"><span
                  class="fa fa-dribbble"></span></a> -->
            </p>
          </div>
        </div>

        <div class="col-md-4 text-center">
          <a class="navbar-brand" href="/">Bonny Fragrance<span></span></a>
        </div>

        <div class="col-md-4 d-flex justify-content-end" style="position: relative;">
          <button type="button" class="form-control search" id="search-trigger"
            style="border: none; background: transparent; cursor: pointer;">
            <span class="fa fa-search"></span>
          </button>

          <form action="{% url 'store:list_product' %}" method="get" class="searchform d-flex" id="search-form"
            style="display: none; position: absolute; top: 100%; right: 0; z-index: 1000;">
            <div class="form-group d-flex mb-0">
              <input type="text" name="query" value="{{ query|default:'' }}" class="form-control pl-3"
                placeholder="Search Bonny..." aria-label="Search" autocomplete="off">
            </div>
            <div id="search-suggestions" class="search-suggestions-dropdown shadow-lg"></div>
          </form>
        </div>
      </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark ftco-navbar-light" id="ftco-navbar">
      <div class="container-fluid px-md-5">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav"
          aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="fa fa-bars"></span> Menu
        </button>

        <div class="collapse navbar-collapse" id="ftco-nav">
          <ul class="navbar-nav m-auto">
            <li class="nav-item {% if request.path == '/' %}active{% endif %}"><a class="nav-link"
                href="{% url 'store:home' %}">Home</a></li>
            <li
              class="nav-item {% if '/list_product' in request.path and 'category=' not in request.get_full_path %}active{% endif %}">
              <a href="{% url 'store:list_product' %}" class="nav-link">Products</a>
            </li>
            <li class="nav-item dropdown {% if '?category=' in request.get_full_path %}active{% endif %}">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown"
                aria-haspopup="true" aria-expanded="false">Categories</a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                {% for category in categories %}
                <a class="dropdown-item" href="{% url 'store:list_product' %}?category={{ category.slug }}">
                  {{ category.name }}
                </a>
                {% endfor %}
              </div>
            </li>
            <li class="nav-item"><a class="nav-link" href="{% url 'store:home' %}#about-section">About</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'store:home' %}#why-us">Why Us</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'store:home' %}#testimonial">Testimonial</a></li>
          </ul>
        </div>

        <div class="user-menu d-flex align-items-center">
          {% if user.is_authenticated %}
          <div class="nav-item dropdown">
            <a class="nav-link dropdown-toggle nav-icon-circle" href="#" id="userDropdown" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fa fa-user"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">My Profile</a></li>
              <li><a class="dropdown-item" href="#">Orders</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a class="dropdown-item" href="{% url 'accounts:logout' %}">Logout</a></li>
            </ul>
          </div>
          {% else %}
          <a href="{% url 'accounts:register' %}" class="nav-icon-circle ms-2" title="Signup">
            <i class="fa fa-user-plus"></i>
          </a>
          <a href="{% url 'accounts:login' %}" class="nav-icon-circle ms-2" title="Login">
            <i class="fa fa-sign-in"></i>
          </a>
          {% endif %}
        </div>

        <div class="cart-dropdown-wrapper ms-3">
          <a href="{% url 'cart:cart_detail' %}" class="nav-cart-link">
            <div class="cart-icon-container">
              <i class="fa-solid fa-cart-shopping"></i>
              <span id="cart-count-badge" class="cart-count-badge">{{ cart|length|default:0 }}</span>
            </div>
          </a>
        </div>
      </div>
      </div>
    </nav>
  </section>
</header>

<!-- end header section -->
