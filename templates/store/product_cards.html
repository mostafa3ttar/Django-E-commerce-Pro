{% for product in products %}
<div class="col-md-4 col-sm-6">
  <div class="product-card-modern shadow-sm h-100">
    <div class="card-img-wrapper">
      <a href="{{product.get_product_url}}">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid">
        {% endif %}
      </a>
    </div>
    <div class="card-info-content p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold product-title-text m-0">
          <a href="{{product.get_product_url}}">
            {{product.name|title}}
          </a>
        </h6>
        <div class="rating-box small text-warning">
          <i class="fa-solid fa-star"></i>
          <span class="text-muted fw-normal ms-1">4.9(1,44)</span>
        </div>
      </div>
      <div class="price-tag fw-bold text-secondary">${{ product.price }}</div>
    </div>
  </div>
</div>
{% empty %}
<div class="col-12 text-center py-5">
  <p class="text-muted">No products found in this category.</p>
</div>
{% endfor %}
