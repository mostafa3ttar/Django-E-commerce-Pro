{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Register{% endblock title %}

{% block content %}
<div class="container">
    <div class="row justify-content-center my-5">
        <div class="col-md-5 col-lg-4">
            <h2 class="text-center mb-4" style="letter-spacing: 5px; text-transform: uppercase;">Register</h2>
            
            <form method="post" class="luxury-form">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="luxury-btn">Register</button>
            </form>
            
            <p class="text-center mt-3" style="font-size: 0.9rem;">
                Have an account? <a href="{% url 'accounts:login' %}" style="color: #748CAB;">Login</a> 
            </p>
        </div>
    </div>
</div>
{% endblock content %}
